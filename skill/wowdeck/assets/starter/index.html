<!doctype html>
<html lang="{{DECK_LANG}}" data-aspect="{{ASPECT}}" data-background-mode="{{BACKGROUND_MODE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="wowdeck-accent" content="{{ACCENT_CSS}}">
  <script id="deck-config" type="application/json">
    {
      "version": 2,
      "aspect": "16:9",
      "background_mode": "light",
      "features": ["navigation"],
      "title": "WOWDECK_PLACEHOLDER"
    }
  </script>
  <title>{{DECK_TITLE_HTML}}</title>
  <style>
    :root {
      --aspect-16-9-width: 1600px;
      --aspect-16-9-height: 900px;
      --aspect-4-3-width: 1200px;
      --aspect-4-3-height: 900px;
      --stage-width: var(--aspect-16-9-width);
      --stage-height: var(--aspect-16-9-height);
      --stage-ratio: 16 / 9;
      --stage-scale: 1;
      --stage-shell-width: var(--stage-width);
      --stage-shell-height: var(--stage-height);
      --page-bg: #101113;
      --slide-bg: #f2f1ed;
      --ink: #17191c;
      --muted: #686b70;
      --line: #c9c8c3;
      --accent: #315f75;
      --focus: #0b74c7;
      --panel-bg: #ffffff;
      --overlay-bg: rgb(10 12 14 / 72%);
      --surface-subtle: rgb(0 0 0 / 4%);
      --radius: 18px;
      --ease: cubic-bezier(.22, .72, .24, 1);
    }

    :root[data-background-mode="dark"] {
      --page-bg: #080b0e;
      --slide-bg: #14181d;
      --ink: #f4f6f7;
      --muted: #b7bec4;
      --line: #3b444c;
      --accent: #79d9b0;
      --focus: #6fc3ff;
      --panel-bg: #1c2228;
      --overlay-bg: rgb(0 0 0 / 76%);
      --surface-subtle: rgb(255 255 255 / 5%);
    }

    :root[data-aspect="16:9"] {
      --stage-width: var(--aspect-16-9-width);
      --stage-height: var(--aspect-16-9-height);
      --stage-ratio: 16 / 9;
    }

    :root[data-aspect="4:3"] {
      --stage-width: var(--aspect-4-3-width);
      --stage-height: var(--aspect-4-3-height);
      --stage-ratio: 4 / 3;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: var(--page-bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    output,
    progress,
    time { font: inherit; }

    button:focus-visible,
    [href]:focus-visible,
    [tabindex]:focus-visible,
    video:focus-visible,
    audio:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    [hidden] { display: none !important; }

    #deck-viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 18px;
    }

    :root[data-controls-visible="true"] #deck-viewport {
      inset-block-end: 82px;
    }

    #stage-shell {
      position: relative;
      width: var(--stage-shell-width);
      height: var(--stage-shell-height);
    }

    #stage {
      position: absolute;
      inset: 0 auto auto 0;
      width: var(--stage-width);
      height: var(--stage-height);
      overflow: hidden;
      transform: scale(var(--stage-scale));
      transform-origin: top left;
      color: var(--ink);
      background: var(--slide-bg);
      box-shadow: 0 30px 100px rgb(0 0 0 / 38%);
    }

    /* Authoring scaffold: replace scene composition below for the actual story.
       Reuse the runtime controller, not this title/paragraph layout as a deck theme. */
    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 42px;
      padding: 64px 76px 54px;
      visibility: hidden;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    :root[data-ready="true"] .slide {
      transition:
        opacity 300ms var(--ease),
        transform 300ms var(--ease),
        visibility 0s linear 300ms;
    }

    .slide.is-active {
      visibility: visible;
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    :root[data-ready="true"] .slide.is-active {
      transition:
        opacity 300ms var(--ease),
        transform 300ms var(--ease);
    }

    .slide-header,
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.3;
    }

    .slide-header {
      padding-block-end: 18px;
      border-block-end: 1px solid var(--line);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .slide-footer {
      padding-block-start: 18px;
      border-block-start: 1px solid var(--line);
    }

    .slide-content {
      display: grid;
      align-content: center;
      max-width: 1120px;
    }

    .slide-content h1,
    .slide-content h2,
    .slide-content p { margin: 0; }

    .slide-content h1,
    .slide-content h2 {
      max-width: 1050px;
      font-size: clamp(64px, 5.7vw, 96px);
      line-height: .98;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .slide-content p {
      max-width: 820px;
      margin-block-start: 30px;
      color: var(--muted);
      font-size: 30px;
      line-height: 1.42;
    }

    .placeholder-mark {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
    }

    #deck-controls {
      position: fixed;
      inset: auto 50% 14px auto;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      max-width: calc(100vw - 28px);
      padding: 8px;
      transform: translateX(50%);
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 16px;
      color: #f5f5f2;
      background: rgb(17 19 22 / 92%);
      box-shadow: 0 16px 48px rgb(0 0 0 / 32%);
      backdrop-filter: blur(16px);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group + .control-group {
      padding-inline-start: 10px;
      border-inline-start: 1px solid rgb(255 255 255 / 16%);
    }

    #deck-controls button {
      min-width: 40px;
      min-height: 36px;
      padding: 7px 11px;
      border: 0;
      border-radius: 9px;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    #deck-controls button:hover:not(:disabled) {
      background: rgb(255 255 255 / 10%);
    }

    #deck-controls button:disabled {
      color: rgb(245 245 242 / 38%);
      cursor: default;
    }

    #slide-counter,
    #elapsed-time {
      min-width: 72px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    #slide-progress {
      width: min(220px, 22vw);
      height: 5px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      color: #77b7d2;
      background: rgb(255 255 255 / 15%);
      appearance: none;
    }

    #slide-progress::-webkit-progress-bar {
      border-radius: 999px;
      background: rgb(255 255 255 / 15%);
    }

    #slide-progress::-webkit-progress-value {
      border-radius: 999px;
      background: currentColor;
      transition: width 220ms var(--ease);
    }

    #slide-progress::-moz-progress-bar {
      border-radius: 999px;
      background: currentColor;
    }

    #presenter-panel {
      position: fixed;
      inset: auto 20px 84px auto;
      z-index: 35;
      width: min(520px, calc(100vw - 40px));
      max-height: min(600px, calc(100vh - 120px));
      overflow: auto;
      padding: 24px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: var(--radius);
      color: #f5f5f2;
      background: rgb(17 19 22 / 96%);
      box-shadow: 0 24px 72px rgb(0 0 0 / 42%);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block-end: 16px;
      border-block-end: 1px solid rgb(255 255 255 / 16%);
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .panel-heading button,
    [data-close-dialog] {
      min-width: 38px;
      min-height: 38px;
      border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 10px;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    #presenter-notes {
      margin: 20px 0 0;
      color: #d2d3d0;
      font-size: 20px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    #planned-time {
      display: block;
      margin-block-start: 18px;
      color: #a7aaad;
      font-size: 14px;
    }

    [data-dialog] {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 28px;
      color: #f5f5f2;
      background: var(--overlay-bg);
      backdrop-filter: blur(12px);
    }

    [data-dialog-panel] {
      width: min(840px, 94vw);
      max-height: 86vh;
      overflow: auto;
      padding: 28px;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: var(--radius);
      background: #1a1c20;
      box-shadow: 0 28px 90px rgb(0 0 0 / 44%);
    }

    [data-media-shell] {
      position: relative;
    }

    [data-media-fallback] {
      min-height: 120px;
      margin: 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--surface-subtle);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        transition-delay: 0s !important;
      }
    }

    @page deck-wide { size: 16in 9in; margin: 0; }
    @page deck-standard { size: 12in 9in; margin: 0; }

    @media print {
      @page { size: landscape; margin: 0; }

      html,
      body {
        width: auto;
        height: auto;
        overflow: visible;
        color: var(--ink);
        background: var(--slide-bg);
      }

      #deck-viewport,
      #stage-shell,
      #stage {
        position: static;
        display: block;
        width: auto;
        height: auto;
        overflow: visible;
        padding: 0;
        transform: none !important;
        box-shadow: none;
      }

      .slide {
        position: relative;
        display: grid !important;
        width: var(--stage-width);
        height: var(--stage-height);
        visibility: visible !important;
        opacity: 1 !important;
        transform: none !important;
        pointer-events: auto;
        break-after: page;
        page-break-after: always;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      :root[data-aspect="16:9"] .slide { page: deck-wide; }
      :root[data-aspect="4:3"] .slide { page: deck-standard; }

      .slide:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      #deck-controls,
      #presenter-panel,
      [data-dialog],
      noscript,
      video,
      audio { display: none !important; }

      [data-media-fallback] { display: block !important; }
    }
  </style>
</head>
<body>
  <div id="deck-viewport">
    <div id="stage-shell">
      <main id="stage" aria-label="{{DECK_TITLE_HTML}}">
        <section
          class="slide is-active"
          id="slide-1"
          data-title="Starter slide"
          aria-labelledby="slide-1-title"
          aria-hidden="false"
          tabindex="-1"
        >
          <header class="slide-header">
            <span class="placeholder-mark">WOWDECK_PLACEHOLDER</span>
            <span>01</span>
          </header>
          <div class="slide-content">
            <h1 id="slide-1-title">{{DECK_TITLE_HTML}}</h1>
            <p>{{DECK_SUBTITLE_HTML}}</p>
          </div>
          <footer class="slide-footer">
            <span>Starter shell</span>
            <span>1</span>
          </footer>
          <aside data-notes data-duration="0" hidden></aside>
        </section>
      </main>
    </div>
  </div>

  <nav id="deck-controls" aria-label="Presentation controls" hidden>
    <div id="navigation-controls" class="control-group" hidden>
      <button id="previous-slide" type="button" aria-label="Previous slide">←</button>
      <output id="slide-counter" aria-live="polite">1 / 1</output>
      <progress id="slide-progress" value="1" max="1" aria-label="Slide progress"></progress>
      <button id="next-slide" type="button" aria-label="Next slide">→</button>
    </div>
    <div id="presenter-controls" class="control-group" hidden>
      <button id="notes-toggle" type="button" aria-controls="presenter-panel" aria-expanded="false">Notes</button>
      <button id="presenter-timer-toggle" type="button">Start</button>
      <time id="elapsed-time" datetime="PT0S" aria-label="Elapsed time">00:00</time>
    </div>
  </nav>

  <aside id="presenter-panel" aria-labelledby="presenter-title" hidden>
    <div class="panel-heading">
      <h2 id="presenter-title">Speaker notes</h2>
      <button id="notes-close" type="button" aria-label="Close speaker notes">×</button>
    </div>
    <p id="presenter-notes"></p>
    <span id="planned-time" hidden></span>
  </aside>

  <noscript>Interactive presentation features require JavaScript.</noscript>

  <script>
    (() => {
      'use strict';

      const ALLOWED_FEATURES = Object.freeze(['navigation', 'presenter', 'media', 'dialog']);
      const DEFAULT_CONFIG = Object.freeze({
        version: 2,
        aspect: '16:9',
        background_mode: 'light',
        features: Object.freeze(['navigation']),
        title: 'Untitled presentation'
      });

      const root = document.documentElement;
      const stage = document.getElementById('stage');
      const viewport = document.getElementById('deck-viewport');
      const controls = document.getElementById('deck-controls');
      const navigationControls = document.getElementById('navigation-controls');
      const presenterControls = document.getElementById('presenter-controls');
      const presenterPanel = document.getElementById('presenter-panel');
      const previousButton = document.getElementById('previous-slide');
      const nextButton = document.getElementById('next-slide');
      const counter = document.getElementById('slide-counter');
      const progress = document.getElementById('slide-progress');
      const notesToggle = document.getElementById('notes-toggle');
      const notesClose = document.getElementById('notes-close');
      const notesBody = document.getElementById('presenter-notes');
      const plannedTime = document.getElementById('planned-time');
      const presenterTimerToggle = document.getElementById('presenter-timer-toggle');
      const elapsedTime = document.getElementById('elapsed-time');
      const slides = [...document.querySelectorAll('.slide')];
      const state = {
        index: 0,
        activeDialog: null,
        dialogTrigger: null,
        dialogAriaHidden: null,
        isolatedElements: [],
        presenterStartedAt: null,
        presenterElapsedMs: 0,
        presenterTimerStarted: false,
        timerId: null
      };
      const COPY = Object.freeze({
        en: Object.freeze({
          controls: 'Presentation controls',
          previousSlide: 'Previous slide',
          nextSlide: 'Next slide',
          slideProgress: 'Slide progress',
          elapsedTime: 'Elapsed time',
          notes: 'Notes',
          speakerNotes: 'Speaker notes',
          closeSpeakerNotes: 'Close speaker notes',
          showSpeakerNotes: 'Show speaker notes',
          noSpeakerNotes: 'No speaker notes on this slide',
          plannedTime: 'Planned time',
          start: 'Start',
          pause: 'Pause',
          resume: 'Resume',
          slide: 'Slide',
          slidePosition: (current, total) => `Slide ${current} of ${total}`,
          separator: ': '
        }),
        zh: Object.freeze({
          controls: '演示控制',
          previousSlide: '上一张',
          nextSlide: '下一张',
          slideProgress: '幻灯片进度',
          elapsedTime: '已用时间',
          notes: '备注',
          speakerNotes: '演讲者备注',
          closeSpeakerNotes: '关闭演讲者备注',
          showSpeakerNotes: '显示演讲者备注',
          noSpeakerNotes: '当前幻灯片没有演讲者备注',
          plannedTime: '计划时长',
          start: '开始',
          pause: '暂停',
          resume: '继续',
          slide: '幻灯片',
          slidePosition: (current, total) => `第 ${current} 张，共 ${total} 张`,
          separator: '：'
        })
      });
      const copy = root.lang.trim().toLowerCase().startsWith('zh') ? COPY.zh : COPY.en;

      function readConfig() {
        const node = document.getElementById('deck-config');
        let raw = {};

        try {
          raw = node ? JSON.parse(node.textContent) : {};
        } catch (error) {
          console.warn('WowDeck: invalid #deck-config JSON; using defaults.', error);
        }

        const requestedFeatures = Array.isArray(raw.features)
          ? raw.features
          : DEFAULT_CONFIG.features;
        const features = [...new Set(
          requestedFeatures.filter((item) => ALLOWED_FEATURES.includes(item))
        )];

        return Object.freeze({
          version: Number.isInteger(raw.version) && raw.version > 0
            ? raw.version
            : DEFAULT_CONFIG.version,
          aspect: raw.aspect === '4:3' ? '4:3' : '16:9',
          background_mode: raw.background_mode === 'dark' ? 'dark' : 'light',
          features: Object.freeze(features),
          title: typeof raw.title === 'string' && raw.title.trim()
            ? raw.title.trim()
            : DEFAULT_CONFIG.title
        });
      }

      const config = readConfig();
      const enabled = new Set(config.features);
      const hasFeature = (name) => enabled.has(name);
      const accent = document.querySelector('meta[name="wowdeck-accent"]')?.content || '';

      root.dataset.aspect = config.aspect;
      root.dataset.backgroundMode = config.background_mode;
      root.dataset.features = config.features.join(' ');
      if (/^#[0-9a-f]{6}$/i.test(accent)) root.style.setProperty('--accent', accent);
      document.title = config.title;
      stage.setAttribute('aria-label', config.title);

      function applyRuntimeCopy() {
        controls.setAttribute('aria-label', copy.controls);
        previousButton.setAttribute('aria-label', copy.previousSlide);
        nextButton.setAttribute('aria-label', copy.nextSlide);
        progress.setAttribute('aria-label', copy.slideProgress);
        notesToggle.textContent = copy.notes;
        presenterTimerToggle.textContent = copy.start;
        elapsedTime.setAttribute('aria-label', copy.elapsedTime);
        document.getElementById('presenter-title').textContent = copy.speakerNotes;
        notesClose.setAttribute('aria-label', copy.closeSpeakerNotes);
      }

      function fitStage() {
        const styles = getComputedStyle(root);
        const width = Number.parseFloat(styles.getPropertyValue('--stage-width')) || 1600;
        const height = Number.parseFloat(styles.getPropertyValue('--stage-height')) || 900;
        const availableWidth = Math.max(1, viewport.clientWidth - 36);
        const availableHeight = Math.max(1, viewport.clientHeight - 36);
        const scale = Math.min(availableWidth / width, availableHeight / height, 1);
        root.style.setProperty('--stage-scale', String(scale));
        root.style.setProperty('--stage-shell-width', `${width * scale}px`);
        root.style.setProperty('--stage-shell-height', `${height * scale}px`);
      }

      function clampIndex(value) {
        if (!slides.length) return -1;
        return Math.max(0, Math.min(slides.length - 1, value));
      }

      function slideTitle(slide, index) {
        return slide?.dataset.title?.trim()
          || slide?.querySelector('h1, h2, h3')?.textContent?.trim()
          || `${copy.slide} ${index + 1}`;
      }

      function indexFromHash() {
        if (!location.hash) return -1;

        let token = location.hash.slice(1);
        try { token = decodeURIComponent(token); } catch (error) { return -1; }

        if (/^\d+$/.test(token)) {
          const numberedIndex = Number.parseInt(token, 10) - 1;
          return numberedIndex >= 0 && numberedIndex < slides.length ? numberedIndex : -1;
        }

        return slides.findIndex((slide) => slide.id === token);
      }

      function writeHash(slide) {
        if (!hasFeature('navigation') || !slide?.id) return;
        const nextHash = `#${encodeURIComponent(slide.id)}`;
        if (location.hash === nextHash) return;

        try {
          history.replaceState(null, '', nextHash);
        } catch (error) {
          console.warn('WowDeck: could not update the slide hash.', error);
        }
      }

      function noteFor(slide) {
        const node = slide?.querySelector('[data-notes]');
        const text = node?.textContent?.trim() || '';
        if (!text) return null;

        const seconds = Number.parseInt(node.dataset.duration || '0', 10);
        return {
          text,
          seconds: Number.isFinite(seconds) && seconds > 0 ? seconds : 0
        };
      }

      function formatTime(totalSeconds) {
        const safeSeconds = Math.max(0, Math.floor(totalSeconds));
        const minutes = Math.floor(safeSeconds / 60);
        const seconds = safeSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function closePresenterPanel(restoreFocus = true) {
        if (presenterPanel.hidden) return;
        presenterPanel.hidden = true;
        notesToggle.setAttribute('aria-expanded', 'false');
        if (restoreFocus && !notesToggle.disabled) notesToggle.focus();
      }

      function updatePresenter() {
        if (!presenterAvailable) return;
        const note = noteFor(slides[state.index]);
        notesToggle.disabled = !note;
        notesToggle.title = note ? copy.showSpeakerNotes : copy.noSpeakerNotes;

        if (!note) {
          notesBody.textContent = '';
          plannedTime.hidden = true;
          closePresenterPanel(false);
          return;
        }

        notesBody.textContent = note.text;
        plannedTime.hidden = note.seconds === 0;
        plannedTime.textContent = note.seconds
          ? `${copy.plannedTime}${copy.separator}${formatTime(note.seconds)}`
          : '';
      }

      function pauseInactiveMedia() {
        if (!hasFeature('media')) return;
        const activeSlide = slides[state.index];
        document.querySelectorAll('video, audio').forEach((media) => {
          if (!activeSlide?.contains(media)) media.pause();
        });
      }

      function show(requestedIndex, options = {}) {
        const nextIndex = clampIndex(requestedIndex);
        if (nextIndex < 0) return false;

        state.index = nextIndex;
        slides.forEach((slide, index) => {
          const active = index === nextIndex;
          slide.classList.toggle('is-active', active);
          slide.setAttribute('aria-hidden', String(!active));
          slide.inert = !active;
        });

        if (hasFeature('navigation')) {
          counter.textContent = `${nextIndex + 1} / ${slides.length}`;
          progress.max = Math.max(1, slides.length);
          progress.value = nextIndex + 1;
          progress.setAttribute('aria-valuetext', copy.slidePosition(nextIndex + 1, slides.length));
          previousButton.disabled = nextIndex === 0;
          nextButton.disabled = nextIndex === slides.length - 1;
          writeHash(slides[nextIndex]);
        }

        updatePresenter();
        pauseInactiveMedia();

        if (options.focus) {
          window.requestAnimationFrame(() => {
            if (state.index === nextIndex) slides[nextIndex].focus({ preventScroll: true });
          });
        }
        return true;
      }

      function previous(options = {}) {
        return show(state.index - 1, options);
      }

      function next(options = {}) {
        return show(state.index + 1, options);
      }

      const presenterAvailable = hasFeature('presenter')
        && slides.some((slide) => noteFor(slide));

      function initializeControls() {
        const navigationAvailable = hasFeature('navigation') && slides.length > 0;
        navigationControls.hidden = !navigationAvailable;
        presenterControls.hidden = !presenterAvailable;
        controls.hidden = !(navigationAvailable || presenterAvailable);
        root.dataset.controlsVisible = String(!controls.hidden);
        notesToggle.disabled = !presenterAvailable;
        presenterTimerToggle.disabled = !presenterAvailable;
        updatePresenterTimerControl();
      }

      function updateElapsedTime() {
        if (!presenterAvailable) return;
        const runningMs = state.presenterStartedAt === null
          ? 0
          : Date.now() - state.presenterStartedAt;
        const seconds = Math.floor((state.presenterElapsedMs + runningMs) / 1000);
        elapsedTime.textContent = formatTime(seconds);
        elapsedTime.dateTime = `PT${seconds}S`;
      }

      function updatePresenterTimerControl() {
        const running = state.presenterStartedAt !== null;
        const label = running
          ? copy.pause
          : (state.presenterTimerStarted ? copy.resume : copy.start);
        presenterTimerToggle.textContent = label;
        presenterTimerToggle.setAttribute('aria-label', label);
      }

      function startPresenterTimer() {
        if (!presenterAvailable || state.presenterStartedAt !== null) return false;
        state.presenterTimerStarted = true;
        state.presenterStartedAt = Date.now();
        updateElapsedTime();
        updatePresenterTimerControl();
        state.timerId = window.setInterval(updateElapsedTime, 250);
        return true;
      }

      function pausePresenterTimer() {
        if (!presenterAvailable || state.presenterStartedAt === null) return false;
        state.presenterElapsedMs += Date.now() - state.presenterStartedAt;
        state.presenterStartedAt = null;
        if (state.timerId !== null) window.clearInterval(state.timerId);
        state.timerId = null;
        updateElapsedTime();
        updatePresenterTimerControl();
        return true;
      }

      function togglePresenterTimer() {
        if (state.presenterStartedAt === null) return startPresenterTimer();
        return pausePresenterTimer();
      }

      function openPresenterPanel() {
        if (!presenterAvailable || notesToggle.disabled) return;
        presenterPanel.hidden = false;
        notesToggle.setAttribute('aria-expanded', 'true');
        notesClose.focus();
      }

      function focusableElements(container) {
        const selector = [
          'a[href]',
          'button:not([disabled])',
          'input:not([disabled])',
          'select:not([disabled])',
          'textarea:not([disabled])',
          'video[controls]',
          'audio[controls]',
          '[tabindex]:not([tabindex="-1"])'
        ].join(',');

        return [...container.querySelectorAll(selector)].filter((element) => {
          return !element.hidden && element.getAttribute('aria-hidden') !== 'true';
        });
      }

      function isolateAround(element) {
        state.isolatedElements = [];
        let branch = element;

        while (branch?.parentElement && branch !== document.body) {
          [...branch.parentElement.children].forEach((sibling) => {
            if (sibling === branch) return;
            state.isolatedElements.push({
              element: sibling,
              inert: sibling.inert,
              ariaHidden: sibling.getAttribute('aria-hidden')
            });
            sibling.inert = true;
            sibling.setAttribute('aria-hidden', 'true');
          });
          branch = branch.parentElement;
        }
      }

      function restoreIsolation() {
        state.isolatedElements.forEach(({ element, inert, ariaHidden }) => {
          element.inert = inert;
          if (ariaHidden === null) element.removeAttribute('aria-hidden');
          else element.setAttribute('aria-hidden', ariaHidden);
        });
        state.isolatedElements = [];
      }

      function resolveDialog(target) {
        if (target instanceof HTMLElement) return target.matches('[data-dialog]') ? target : null;
        if (typeof target !== 'string') return null;
        const id = target.replace(/^#/, '');
        const element = document.getElementById(id);
        return element?.matches('[data-dialog]') ? element : null;
      }

      function openDialog(target, trigger = document.activeElement) {
        if (!hasFeature('dialog')) return false;
        const dialog = resolveDialog(target);
        if (!dialog) return false;

        closeDialog(false);
        state.activeDialog = dialog;
        state.dialogTrigger = trigger instanceof HTMLElement ? trigger : null;
        state.dialogAriaHidden = dialog.getAttribute('aria-hidden');
        dialog.hidden = false;
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('aria-hidden', 'false');
        isolateAround(dialog);

        const focusable = focusableElements(dialog);
        const focusTarget = dialog.querySelector('[autofocus]') || focusable[0] || dialog;
        if (focusTarget === dialog && !dialog.hasAttribute('tabindex')) dialog.tabIndex = -1;
        focusTarget.focus({ preventScroll: true });
        return true;
      }

      function closeDialog(restoreFocus = true) {
        if (!state.activeDialog) return false;
        const dialog = state.activeDialog;
        const trigger = state.dialogTrigger;
        dialog.hidden = true;
        dialog.removeAttribute('aria-modal');
        if (state.dialogAriaHidden === null) dialog.removeAttribute('aria-hidden');
        else dialog.setAttribute('aria-hidden', state.dialogAriaHidden);
        restoreIsolation();
        state.activeDialog = null;
        state.dialogTrigger = null;
        state.dialogAriaHidden = null;
        if (restoreFocus && trigger?.isConnected) trigger.focus({ preventScroll: true });
        return true;
      }

      function trapDialogFocus(event) {
        if (!state.activeDialog || event.key !== 'Tab') return;
        const focusable = focusableElements(state.activeDialog);

        if (!focusable.length) {
          event.preventDefault();
          state.activeDialog.focus({ preventScroll: true });
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function mediaFallback(media) {
        const shell = media.closest('[data-media-shell]') || media.parentElement;
        if (!shell) return null;
        let fallback = shell.querySelector('[data-media-fallback]');

        if (!fallback) {
          fallback = document.createElement('p');
          fallback.dataset.mediaFallback = '';
          fallback.textContent = media.dataset.fallbackText || 'Media is unavailable in this view.';
          shell.append(fallback);
        }

        fallback.hidden = true;
        fallback.setAttribute('aria-live', 'polite');
        return fallback;
      }

      function showMediaFailure(media) {
        const fallback = mediaFallback(media);
        media.pause();
        media.hidden = true;
        media.setAttribute('aria-hidden', 'true');
        if (fallback) fallback.hidden = false;
        const status = media.closest('[data-media-shell]')?.querySelector('[data-media-status]');
        if (status) status.textContent = 'Media unavailable';
      }

      function clearMediaFailure(media) {
        const shell = media.closest('[data-media-shell]') || media.parentElement;
        const fallback = shell?.querySelector('[data-media-fallback]');
        media.hidden = false;
        media.removeAttribute('aria-hidden');
        if (fallback) fallback.hidden = true;
      }

      function pauseMedia() {
        if (!hasFeature('media')) return;
        document.querySelectorAll('video, audio').forEach((media) => media.pause());
      }

      function initializeMedia() {
        if (!hasFeature('media')) return;
        document.querySelectorAll('video, audio').forEach((media) => {
          mediaFallback(media);
          media.addEventListener('error', () => showMediaFailure(media));
          media.addEventListener('loadedmetadata', () => clearMediaFailure(media));
          if (media.error || media.networkState === 3) showMediaFailure(media);
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) pauseMedia();
        });
      }

      function initializeDialogs() {
        if (!hasFeature('dialog')) return;

        document.querySelectorAll('[data-dialog]').forEach((dialog) => {
          dialog.hidden = true;
        });

        document.querySelectorAll('[data-open-dialog]').forEach((trigger) => {
          trigger.addEventListener('click', () => openDialog(trigger.dataset.openDialog, trigger));
        });

        document.querySelectorAll('[data-close-dialog]').forEach((trigger) => {
          trigger.addEventListener('click', () => closeDialog());
        });

        document.querySelectorAll('[data-dialog]').forEach((dialog) => {
          dialog.addEventListener('pointerdown', (event) => {
            if (event.target === dialog) closeDialog();
          });
        });
      }

      function isTypingContext(element) {
        return element instanceof HTMLElement
          && (element.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(element.tagName));
      }

      function handleKeydown(event) {
        trapDialogFocus(event);
        if (state.activeDialog) {
          if (event.key === 'Escape') {
            event.preventDefault();
            closeDialog();
          }
          return;
        }

        if (!presenterPanel.hidden && event.key === 'Escape') {
          event.preventDefault();
          closePresenterPanel();
          return;
        }

        if (isTypingContext(document.activeElement)) return;
        const key = event.key.toLowerCase();

        if (presenterAvailable && key === 'n') {
          event.preventDefault();
          if (presenterPanel.hidden) openPresenterPanel();
          else closePresenterPanel();
          return;
        }

        if (!hasFeature('navigation')) return;
        const focusedTag = document.activeElement?.tagName;

        if (['arrowright', 'pagedown'].includes(key)
          || (key === ' ' && !['BUTTON', 'AUDIO', 'VIDEO'].includes(focusedTag))) {
          event.preventDefault();
          next({ focus: true });
        } else if (['arrowleft', 'pageup'].includes(key)) {
          event.preventDefault();
          previous({ focus: true });
        } else if (key === 'home') {
          event.preventDefault();
          show(0, { focus: true });
        } else if (key === 'end') {
          event.preventDefault();
          show(slides.length - 1, { focus: true });
        }
      }

      applyRuntimeCopy();
      initializeControls();
      initializeDialogs();
      initializeMedia();

      if (hasFeature('navigation')) {
        previousButton.addEventListener('click', () => previous());
        nextButton.addEventListener('click', () => next());
        window.addEventListener('hashchange', () => {
          const requestedIndex = indexFromHash();
          if (requestedIndex >= 0 && requestedIndex !== state.index) show(requestedIndex);
        });
      }

      if (presenterAvailable) {
        notesToggle.addEventListener('click', () => {
          if (presenterPanel.hidden) openPresenterPanel();
          else closePresenterPanel();
        });
        notesClose.addEventListener('click', () => closePresenterPanel());
        presenterTimerToggle.addEventListener('click', togglePresenterTimer);
      }

      document.addEventListener('keydown', handleKeydown);
      window.addEventListener('resize', fitStage);

      const initialIndex = hasFeature('navigation') ? indexFromHash() : -1;
      show(initialIndex >= 0 ? initialIndex : 0);
      fitStage();
      requestAnimationFrame(() => { root.dataset.ready = 'true'; });

      const runtime = {
        config,
        hasFeature,
        show,
        currentIndex: () => state.index
      };

      if (hasFeature('navigation')) Object.assign(runtime, { previous, next });
      if (hasFeature('dialog')) Object.assign(runtime, { openDialog, closeDialog });
      if (hasFeature('media')) Object.assign(runtime, { pauseMedia });

      window.WowDeck = Object.freeze(runtime);
    })();
  </script>
</body>
</html>
