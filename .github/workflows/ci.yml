name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Compile Python
        run: python -m py_compile skill/wowdeck/scripts/*.py tests/test_wowdeck_cli.py tests/test_presenter_runtime.py
      - name: Check browser fixture runner
        run: |
          node --check tests/forward/non-pitch-teaching/browser-check.cjs
          node --check skill/wowdeck/scripts/inspect_deck.cjs
      - name: Install browser acceptance runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 sharp@0.34.5
          npx playwright install --with-deps chromium
      - name: Run CLI contract tests
        env:
          WOWDECK_NODE_PATH: ${{ github.workspace }}/node_modules
        run: python -m unittest discover -s tests -v
      - name: Verify browser acceptance evidence
        env:
          WOWDECK_NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/forward/non-pitch-teaching/browser-check.cjs --verify
