name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Compile Python
        run: python -m py_compile skill/wowdeck/scripts/*.py tests/test_wowdeck_cli.py tests/test_presenter_runtime.py
      - name: Run CLI contract tests
        run: python -m unittest discover -s tests -v
